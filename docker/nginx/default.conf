server {
    # Render injects a PORT env var (default 10000).
    # Use envsubst or a similar mechanism, or hardcode 10000 if you prefer.
    listen 10000;
    index index.php;
    root /var/www/html/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Both nginx and php-fpm run in the same container,
        # so use localhost instead of the compose service name "app".
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}